[package]
name = "tern-sync"
description = "Sync tern's encrypted vault, hosts and settings through a private GitHub gist"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23"
keyring = { version = "3", features = ["apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
ureq.workspace = true

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints]
workspace = true
